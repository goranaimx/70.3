<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road to 70.3</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 20px;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .story-frame {
    width: 390px;
    height: 844px;
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    box-shadow: 0 40px 120px rgba(0,0,0,0.8);
  }

  .bg-photo {
    position: absolute;
    inset: 0;
    background-image: url('/mnt/user-data/uploads/IMG_2633.jpeg');
    background-size: cover;
    background-position: center top;
    filter: brightness(0.48) contrast(1.1) saturate(0.85);
  }

  .gradient-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 230px;
    background: linear-gradient(to bottom, rgba(15,23,42,0.82) 0%, transparent 100%);
  }

  .gradient-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 440px;
    background: linear-gradient(to top, rgba(15,23,42,0.98) 0%, rgba(15,23,42,0.6) 50%, transparent 100%);
  }

  /* TOP BAR */
  .top-bar {
    position: absolute;
    top: 40px;
    left: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .top-tag {
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.28em;
    color: rgba(255,255,255,0.38);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .top-line {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.1);
  }

  .top-dot {
    width: 5px;
    height: 5px;
    border-radius: 1px;
    background: #233d4d;
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* PROGRESS BAR */
  .progress-container {
    position: absolute;
    top: 66px;
    left: 24px;
    right: 24px;
  }

  .progress-track {
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #ffffff;
    border-radius: 2px;
    width: var(--target-width, 12.88%);
    opacity: 0;
    animation: fillBar 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes fillBar {
    from { width: 0%; opacity: 0; }
    to   { width: var(--target-width, 12.88%); opacity: 0.7; }
  }

  .progress-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
  }

  .progress-label {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
  }

  /* MAIN CONTENT */
  .main-content {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 24px 28px 48px;
  }

  /* WORKOUT — campo editable */
  .workout-field {
    margin-bottom: 22px;
    opacity: 0;
    animation: fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;
  }

  .workout-input {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    background: rgba(35, 61, 77, 0.55);
    border: 1px solid rgba(35, 61, 77, 0.85);
    border-radius: 9999px;
    padding: 8px 18px;
    cursor: text;
    outline: none;
    min-width: 170px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .workout-input:empty::before {
    content: attr(data-placeholder);
    color: rgba(255,255,255,0.2);
  }

  .workout-input:focus {
    background: rgba(35, 61, 77, 0.75);
    border-color: rgba(35, 61, 77, 1);
  }

  /* DISCIPLINE TAGS */
  .disciplines {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    opacity: 0;
    animation: fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.35s forwards;
  }

  .disc-tag {
    font-size: 7px;
    font-weight: 800;
    letter-spacing: 0.22em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 4px 12px;
    border-radius: 9999px;
    cursor: pointer;
    user-select: none;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }

  .disc-tag[data-active="true"] {
    background: rgba(35, 61, 77, 0.65);
    border-color: rgba(35, 61, 77, 0.9);
    color: rgba(255,255,255,0.9);
  }

  /* CONTADOR */
  .counter-block {
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
  }

  .day-label {
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.22em;
    color: rgba(255,255,255,0.28);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .day-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 126px;
    line-height: 0.86;
    color: #ffffff;
    letter-spacing: -1px;
    display: flex;
    align-items: baseline;
  }

  .day-slash {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 76px;
    color: rgba(255,255,255,0.15);
    margin: 0 2px;
  }

  .day-total {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 76px;
    color: rgba(255,255,255,0.2);
  }

  /* ROAD TO */
  .road-to {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    animation: fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.65s forwards;
  }

  .road-line {
    width: 26px;
    height: 1px;
    background: rgba(255,255,255,0.35);
  }

  .road-text {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.38em;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
  }

  .road-accent {
    color: rgba(255,255,255,0.85);
  }

  /* FECHA */
  .race-date {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    opacity: 0;
    animation: fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
  }

  .date-text {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.22);
    text-transform: uppercase;
  }

  .date-diamond {
    width: 4px;
    height: 4px;
    background: #233d4d;
    border-radius: 1px;
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* IRONMAN BADGE */
  .im-badge {
    position: absolute;
    bottom: 48px;
    right: 28px;
    text-align: right;
    opacity: 0;
    animation: fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) 1s forwards;
  }

  .im-label {
    font-size: 7px;
    font-weight: 900;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.15);
    text-transform: uppercase;
    display: block;
  }

  .im-70 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.1);
    line-height: 1;
    display: block;
  }

  /* CORNER ACCENT */
  .corner-accent {
    position: absolute;
    top: 110px;
    right: 24px;
    width: 1px;
    height: 48px;
    background: linear-gradient(to bottom, rgba(35,61,77,0.7), transparent);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* EXPORT BUTTON */
  .export-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .export-hint {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
  }

  .export-btn {
    background: #233d4d;
    color: #ffffff;
    border: none;
    border-radius: 9999px;
    padding: 14px 36px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    box-shadow: 0 10px 30px rgba(35, 61, 77, 0.4);
  }

  .export-btn:hover  { background: #1a2f3a; transform: translateY(-2px); }
  .export-btn:active { transform: translateY(0); }

  .export-btn.loading {
    pointer-events: none;
    opacity: 0.6;
  }

  /* MODAL */
  .img-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
  }

  .img-modal.open { display: flex; }

  .img-modal img {
    max-width: 100%;
    max-height: 75vh;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }

  .modal-hint {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    text-align: center;
  }

  .modal-close {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 9999px;
    padding: 10px 28px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="story-frame" id="story-frame">

  <div class="bg-photo"></div>
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <span class="top-tag">Training Log</span>
    <div class="top-line"></div>
    <div class="top-dot"></div>
  </div>

  <!-- PROGRESS BAR -->
  <div class="progress-container">
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="progress-labels">
      <span class="progress-label">Día 1</span>
      <span class="progress-label" id="progress-mid">—/163</span>
      <span class="progress-label">Sep 20</span>
    </div>
  </div>

  <div class="corner-accent"></div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-content">

    <!-- WORKOUT EDITABLE -->
    <div class="workout-field">
      <div
        class="workout-input"
        contenteditable="true"
        data-placeholder="25k ride · 5k run"
        spellcheck="false"
      ></div>
    </div>

    <!-- DISCIPLINE TAGS -->
    <div class="disciplines">
      <div class="disc-tag" data-active="false">Swim</div>
      <div class="disc-tag" data-active="false">Bike</div>
      <div class="disc-tag" data-active="false">Run</div>
      <div class="disc-tag" data-active="false">Gym</div>
    </div>

    <!-- CONTADOR -->
    <div class="counter-block">
      <div class="day-label" id="day-label-text">Día de entrenamiento</div>
      <div class="day-number">
        <span id="days-count">—</span>
        <span class="day-slash">/</span>
        <span class="day-total">163</span>
      </div>
    </div>

    <!-- ROAD TO -->
    <div class="road-to">
      <div class="road-line"></div>
      <span class="road-text">Road to <span class="road-accent">70.3</span></span>
    </div>

    <!-- FECHA -->
    <div class="race-date">
      <span class="date-text">Race Day</span>
      <div class="date-diamond"></div>
      <span class="date-text">20 Sep 2026</span>
      <div class="date-diamond"></div>
      <span class="date-text" id="days-left">— días</span>
    </div>

  </div>

  <!-- IRONMAN BADGE -->
  <div class="im-badge">
    <span class="im-label">Ironman</span>
    <span class="im-70">70.3</span>
  </div>

</div>

<!-- EXPORT BUTTON (fuera del frame, no aparece en el PNG) -->
<div class="export-wrap">
  <span class="export-hint">Selecciona disciplinas · escribe tu entreno · exporta</span>
  <button class="export-btn" id="export-btn">Exportar overlay</button>
</div>

<!-- MODAL: imagen lista para long-press → Copiar -->
<div class="img-modal" id="img-modal">
  <span class="modal-hint">Mantén presionada la imagen → Copiar</span>
  <img id="modal-img" src="" alt="overlay">
  <button class="modal-close" id="modal-close">Cerrar</button>
</div>

<script>
  /* ─── Fechas ─── */
  const START_DATE = new Date('2026-04-14T00:00:00');
  const RACE_DATE  = new Date('2026-09-20T00:00:00');
  const TOTAL_DAYS = 163;

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const diffStart  = Math.floor((today - START_DATE) / (1000 * 60 * 60 * 24)) + 1;
  const currentDay = Math.min(Math.max(diffStart, 1), TOTAL_DAYS);
  const diffRace   = Math.ceil((RACE_DATE - today) / (1000 * 60 * 60 * 24));
  const pct        = ((currentDay / TOTAL_DAYS) * 100).toFixed(2);

  document.getElementById('days-count').textContent     = currentDay;
  document.getElementById('days-left').textContent      = diffRace + ' días';
  document.getElementById('day-label-text').textContent = 'Día ' + currentDay + ' de entrenamiento';
  document.getElementById('progress-mid').textContent   = currentDay + '/163';

  const fill = document.querySelector('.progress-fill');
  fill.style.setProperty('--target-width', pct + '%');
  fill.style.animation = 'none';
  fill.style.width = '0%';
  requestAnimationFrame(() => {
    fill.style.animation = 'fillBar 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards';
  });

  /* ─── Workout input ─── */
  document.querySelector('.workout-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') e.preventDefault();
  });

  /* ─── Discipline tags toggle ─── */
  document.querySelectorAll('.disc-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      const isActive = tag.dataset.active === 'true';
      tag.dataset.active = isActive ? 'false' : 'true';
    });
  });

  /* ─── Export overlay PNG ─── */
  document.getElementById('export-btn').addEventListener('click', async () => {
    const btn   = document.getElementById('export-btn');
    const frame = document.getElementById('story-frame');
    const modal = document.getElementById('img-modal');
    const modalImg = document.getElementById('modal-img');

    const hiddenLayers = frame.querySelectorAll('.bg-photo, .gradient-top, .gradient-bottom');
    hiddenLayers.forEach(el => el.style.visibility = 'hidden');

    btn.textContent = 'Generando…';
    btn.classList.add('loading');

    try {
      const canvas = await html2canvas(frame, {
        backgroundColor: null,
        scale: 2,
        useCORS: true,
        allowTaint: false,
        logging: false,
      });

      hiddenLayers.forEach(el => el.style.visibility = '');
      btn.textContent = 'Exportar overlay';
      btn.classList.remove('loading');

      // Mostrar en modal para long-press → Copiar en iOS
      modalImg.src = canvas.toDataURL('image/png');
      modal.classList.add('open');

    } catch {
      hiddenLayers.forEach(el => el.style.visibility = '');
      btn.textContent = 'Error — intenta de nuevo';
      btn.classList.remove('loading');
      setTimeout(() => { btn.textContent = 'Exportar overlay'; }, 2500);
    }
  });

  document.getElementById('modal-close').addEventListener('click', () => {
    const modal = document.getElementById('img-modal');
    modal.classList.remove('open');
    document.getElementById('modal-img').src = '';
  });
</script>
</body>
</html>
